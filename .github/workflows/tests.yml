name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install FFmpeg for synthetic audio conversion tests
        run: choco install ffmpeg --no-progress -y
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps
          python -m pip install numpy==1.26.4 PyYAML scipy soundfile sounddevice opencc-python-reimplemented webrtcvad-wheels huggingface-hub cffi typing-extensions
          python -m pip install qwen-asr==0.0.6 --no-deps
      - name: Run unit tests without model downloads or GPU
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests
