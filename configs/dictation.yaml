# Desktop dictation is independent of the file-transcription defaults.
engine: qwen3-asr-1.7b
sample_rate: 16000
silence_ms: 600
min_speech_ms: 240
max_chunk_sec: 20
# null follows the current Windows default input device at each recording.
input_device: DJI Mic Mini
# Optional context; leave empty to avoid prompt echo on unclear audio.
hotwords: ""
# Mirror the same session on the physical main monitor and MTT VDD.
# Hardware model IDs remain stable when Windows display numbers change.
# null uses the current Windows primary monitor instead.
panel_monitor_ids: [PHLC34B, MTT1337]
