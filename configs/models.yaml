defaults:
  engine: sensevoice

strict:
  primary_engine: qwen3-asr-1.7b
  secondary_engine: sensevoice

llm_arbitration:
  enabled: false
  provider: ollama
  base_url: http://127.0.0.1:11434
  model: qwen-main-v1:latest
  fallback_model: qwen3.6-27b-256k:latest
  mode: uncertain_only
  temperature: 0.1
  keep_alive: 0
  timeout_sec: 120

aliases:
  fsmn-vad: iic/speech_fsmn_vad_zh-cn-16k-common-pytorch
  ct-punc: iic/punc_ct-transformer_cn-en-common-vocab471067-large
  cam++: iic/speech_campplus_sv_zh-cn_16k-common

engines:
  fireredasr2-llm:
    adapter: firered-worker
    role: lexical_primary
    model: FireRedTeam/FireRedASR2-LLM
    language: Chinese
    options:
      runtime: wsl
      wsl_distribution: Ubuntu
      python_path: /opt/chineseasr/firered/.venv/bin/python
      source_dir: models/firered/FireRedASR2S
      source_revision: 4e7d9aaf4482a47cec1724807026b9b151926eb5
      model_dir: models/firered/FireRedASR2-LLM
      model_revision: 2c5e0f415b9afb8f67cb8b00ea4c54959f70e824
      use_half: true
      batch_size: 1
      max_request_inputs: 16
      beam_size: 3
      repetition_penalty: 3.0
      llm_length_penalty: 1.0
      temperature: 1.0
      timeout_sec: 900
      requires_pcm16_mono: true
      max_audio_sec: 40
      recommended_chunk_sec: 35
    note: Optional evidence-grade lexical primary; promote only after local holdout validation.

  qwen3-asr-1.7b:
    adapter: qwen-asr
    role: primary
    model: Qwen/Qwen3-ASR-1.7B
    language: Chinese
    options:
      dtype: bfloat16
      max_inference_batch_size: 8
      max_new_tokens: 256
      context: 请只输出简体中文转写文本，不要输出繁体字、解释、翻译或额外说明。
    note: Current accuracy-first strict primary based on public Qwen3-ASR evaluations.

  sensevoice:
    adapter: funasr
    role: anchor
    model: iic/SenseVoiceSmall
    vad_model: fsmn-vad
    punc_model: ct-punc
    spk_model: cam++
    language: auto
    note: Primary local Chinese low-hallucination engine.

  paraformer:
    adapter: funasr
    role: baseline
    model: iic/speech_paraformer-large_asr_nat-zh-cn-16k-common-vocab8404-pytorch
    vad_model: fsmn-vad
    punc_model: ct-punc
    spk_model: cam++
    language: zh
    note: Conservative Mandarin/CN baseline for cross-checking.

  whisper-large-v3:
    adapter: whisper
    role: fallback
    model: openai/whisper-large-v3
    language: zh
    is_whisper: true
    note: Fallback/comparison only; not the primary Chinese low-hallucination path.
