[project]
name = "local-chinese-asr"
version = "0.1.0"
description = "Local Chinese ASR project focused on low-hallucination transcription."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
zh-asr = "zh_asr.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

